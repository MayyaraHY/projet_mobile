name: projetmobile
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # SQLite dependencies for local database
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^0.4.2+2
  sqlite3_web: ^0.1.1

  # File picker for image selection (NEW)
  file_picker: ^8.1.2
  # Authentication and social sign-in
  # Use local SQLite for authentication and ratings
  # Removed firebase and social sign-in dependencies to use local SQLite-based auth
  crypto: ^3.0.2
  # Persist small state like 'remember me'
  shared_preferences: ^2.1.5
  # Pick an image from gallery/camera
  image_picker: ^0.8.7+6
  # Simple state management for auth state
  provider: ^6.0.5
  # Google Sign In
  google_sign_in: ^6.2.1
  # Facebook Sign In
  flutter_facebook_auth: ^7.1.1
  # HTTP client for API calls
  http: ^1.1.0
  # Device info for session tracking
  device_info_plus: ^10.1.0
  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
