name: projetmobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Use a more flexible SDK constraint

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # These packages must be at the same indentation level as 'flutter:'
  cupertino_icons: ^1.0.8
  window_manager: ^0.3.9
  http: ^0.13.6
  flutter_secure_storage: ^8.0.0

  # SQLite dependencies for local database
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^0.4.2+2
  sqlite3_web: ^0.1.1

  # File picker for image selection (NEW)
  file_picker: ^8.1.2

  # Contracts module dependencies
  pdf: ^3.10.1
  printing: ^5.11.0
  signature: ^5.0.2
  intl: 0.20.2

  # Sharing QR PNGs
  share_plus: ^12.0.1
  # Local QR generation fallback
  qr: ^3.0.2
  image: ^4.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true